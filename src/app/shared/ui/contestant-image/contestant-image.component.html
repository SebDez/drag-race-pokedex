<div
  class="relative w-full h-full overflow-hidden bg-[var(--color-bg-subtle)]"
  [class]="wrapperClass()"
>
  @if (!hasSrc() || loadFailed()) {
    <span
      class="absolute inset-0 block bg-gradient-to-br from-[var(--color-pink-light)] to-[var(--color-gold-light)] opacity-70"
      aria-hidden="true"
    ></span>
    <span
      class="absolute inset-[22%] rounded-md bg-[var(--color-surface)]/35"
      aria-hidden="true"
    ></span>
  } @else {
    <div
      class="absolute inset-0 z-0 overflow-hidden transition-opacity duration-300 ease-out"
      [class.opacity-0]="showLoadedImage()"
      aria-hidden="true"
    >
      <div
        class="absolute inset-0 bg-gradient-to-br from-[var(--color-pink-light)]/50 to-[var(--color-gold-light)]/50"
      ></div>
      <div
        class="absolute inset-0 -translate-x-full animate-[contestant-image-shimmer_1.4s_ease-in-out_infinite] bg-gradient-to-r from-transparent via-[var(--color-surface)]/55 to-transparent"
      ></div>
    </div>

    <img
      [src]="src()!"
      [alt]="alt()"
      [width]="width()"
      [height]="height()"
      [attr.loading]="loadingAttr()"
      [attr.fetchpriority]="fetchPriorityAttr()"
      decoding="async"
      class="relative z-10 h-full w-full transition-opacity duration-300 ease-out"
      [class.object-cover]="objectFit() === 'cover'"
      [class.object-contain]="objectFit() === 'contain'"
      [style.object-position]="objectPosition()"
      [class.opacity-0]="!imageDecoded()"
      [class.opacity-100]="imageDecoded()"
      (load)="onLoad()"
      (error)="onError()"
    />
  }
</div>

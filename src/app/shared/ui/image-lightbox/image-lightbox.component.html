<div
  class="image-lightbox"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="dialogLabelKey() | translate"
  (click)="onBackdropClick()"
>
  <button
    type="button"
    class="image-lightbox__close"
    (click)="onCloseClick($event)"
  >
    {{ closeLabelKey() | translate }}
  </button>

  <div class="image-lightbox__stage" (click)="$event.stopPropagation()">
    <img
      class="image-lightbox__img"
      [class.image-lightbox__img--zoomable]="loupeAvailable()"
      [src]="src()"
      [alt]="alt()"
      (mousemove)="onImageMove($event)"
      (mouseleave)="onImageLeave()"
    />

    @if (loupe(); as glass) {
      <div
        class="image-lightbox__loupe"
        aria-hidden="true"
        [style.width.px]="loupeSize"
        [style.height.px]="loupeSize"
        [style.left.px]="glass.x"
        [style.top.px]="glass.y"
        [style.backgroundImage]="loupeBackgroundImage()"
        [style.backgroundSize]="glass.bgSize"
        [style.backgroundPosition]="glass.bgPos"
      ></div>
    }
  </div>

  @if (loupeAvailable()) {
    <p class="image-lightbox__hint" role="note">
      <span class="image-lightbox__hint-icon" aria-hidden="true">🔍</span>
      {{ 'detail.zoomHint' | translate }}
    </p>
  }
</div>

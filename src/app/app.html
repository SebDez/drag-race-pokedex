<a class="app-skip" href="#main-content">{{ 'nav.skipToContent' | translate }}</a>

<header class="app-header">
  <nav class="app-nav" [attr.aria-label]="'nav.main' | translate">
    <a
      routerLink="/"
      routerLinkActive="app-nav__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="app-nav__link"
    >
      {{ 'nav.pokedex' | translate }}
    </a>
    <a routerLink="/quiz" routerLinkActive="app-nav__link--active" class="app-nav__link">
      {{ 'nav.quiz' | translate }}
    </a>
  </nav>
  <app-lang-selector />
</header>

<main id="main-content" class="app-main">
  <router-outlet />
</main>

@let c = contestant();
<div
  class="queen-card flex flex-col gap-0 border rounded-xl overflow-hidden"
  [ngClass]="{ 'queen-card--expanded': selected() }"
>
  <button
    type="button"
    class="queen-card-btn cursor-pointer w-full flex items-center gap-3 sm:gap-4 p-3 bg-[var(--color-surface)] text-left transition-colors"
    (click)="onClick()"
    [attr.aria-current]="selected() ? 'true' : null"
    [attr.aria-label]="c.dragName"
  >
    <!-- IMAGE -->
    <div
      class="shrink-0 w-14 h-14 sm:w-16 sm:h-16 rounded-lg overflow-hidden bg-[var(--color-bg-subtle)]"
    >
      <app-contestant-image
        [src]="getCardImageUrl(c)"
        [alt]="''"
        [width]="64"
        [height]="64"
      />
    </div>
    <!-- NAME -->
    <span class="flex-1 min-w-0 font-semibold text-[var(--color-text)] truncate">{{
      c.dragName
    }}</span>
    <!-- BADGES -->
    <div class="shrink-0 flex items-stretch gap-1 flex-wrap justify-end h-8">
      <app-winner-badge [show]="shouldShowWinnerBadge(c)" />
      <app-wins-badge [count]="c.totalChallengeWins" />
      <app-franchise-badge [franchiseName]="c.firstFranchise" [truncate]="true" />
    </div>
  </button>
</div>

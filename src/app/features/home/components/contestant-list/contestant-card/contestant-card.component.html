@let c = contestant();
<div
  class="queen-card flex flex-col gap-0 border rounded-xl overflow-hidden"
  [ngClass]="{ 'queen-card--expanded': isExpanded() }"
>
  <button
    type="button"
    class="queen-card-btn cursor-pointer w-full flex items-center gap-3 sm:gap-4 p-3 bg-[var(--color-surface)] text-left transition-colors"
    (click)="onClick()"
    [attr.aria-expanded]="isExpanded()"
    [attr.aria-controls]="detailPanelId"
    [attr.aria-label]="c.dragName"
  >
    <!-- IMAGE -->
    <div
      class="shrink-0 w-14 h-14 sm:w-16 sm:h-16 rounded-lg overflow-hidden bg-[var(--color-bg-subtle)]"
    >
      <app-contestant-image
        [src]="getCardImageUrl(c)"
        [alt]="''"
        [width]="64"
        [height]="64"
      />
    </div>
    <!-- NAME -->
    <span class="flex-1 min-w-0 font-semibold text-[var(--color-text)] truncate">{{
      c.dragName
    }}</span>
    <!-- BADGES -->
    <div class="shrink-0 flex items-stretch gap-1 flex-wrap justify-end h-8">
      <app-winner-badge [show]="shouldShowWinnerBadge(c)" />
      <app-wins-badge [count]="c.totalChallengeWins" />
      <app-franchise-badge [franchiseName]="c.firstFranchise" [truncate]="true" />
    </div>
  </button>
  <!-- Defer + timer: paint expand chrome first, then lazy-load detail chunk -->
  @if (isExpanded()) {
    <div [id]="detailPanelId">
      @defer (on timer(16ms)) {
        <app-contestant-detail [contestant]="contestant()" [displayedSeason]="displayedSeason()" />
      } @placeholder {
        <div
          class="border-t border-[var(--color-border)] p-4 sm:p-5"
          aria-hidden="true"
        >
          <div class="flex gap-4 sm:gap-6">
            <div
              class="shrink-0 w-28 sm:w-36 aspect-square rounded-lg bg-gradient-to-br from-[var(--color-pink-light)]/60 to-[var(--color-gold-light)]/60 animate-pulse"
            ></div>
            <div class="flex-1 flex flex-col gap-2 py-1">
              <div class="h-5 w-2/3 rounded-md bg-[var(--color-border)] animate-pulse"></div>
              <div class="h-3 w-1/2 rounded-md bg-[var(--color-border)]/80 animate-pulse"></div>
              <div class="h-8 w-24 rounded-md bg-[var(--color-pink-light)]/50 animate-pulse mt-1"></div>
            </div>
          </div>
        </div>
      }
    </div>
  }
</div>
